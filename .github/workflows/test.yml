name: Run Tests

on:
  push:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # post and update the coverage comment
      contents: read        # check out the code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout SHARPIE_Gallery
        uses: actions/checkout@v4
        with:
          repository: hybrid-intelligence/SHARPIE_Gallery
          path: SHARPIE_Gallery

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'

      - name: Install graphviz
        run: sudo apt-get install -y graphviz graphviz-dev

      - name: Install Redis
        run: sudo apt-get install -y redis-server

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install the browser
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest --cov
        env:
          SHARPIE_GALLERY_DIR: ${{ github.workspace }}/SHARPIE_Gallery

      - name: Run the Daphne tests
        run: pytest -m daphne

      - name: Coverage comment
        if: github.ref != 'refs/heads/main'
        uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ github.token }}
